name: Weekly Steam snapshot

on:
  schedule:
    # Wednesday 07:30 Asia/Taipei = Tuesday 23:30 UTC (GitHub may start a few minutes late)
    - cron: "30 23 * * 2"
  workflow_dispatch:
  push:
    branches: [claude/weekly-steam-snapshot]  # temporary: test run before merge

permissions:
  contents: write

concurrency:
  group: steam-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect Steam data
        run: python scripts/collect.py
      - name: Build report
        run: python scripts/report.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "Steam snapshot $(date -u +%F)" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
